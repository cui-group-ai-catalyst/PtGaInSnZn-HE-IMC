name: ptgainsnzn
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10.19
  - pip=24.2
  - numpy=2.0.2
  - pandas=2.3.3
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - scipy=1.14.1
  - ase=3.22.1
  - pymatgen=2025.10.7
  - pip:
    - fairchem-core==2.13.0
    - chgnet==0.4.0  # for SI Fig S2 cross-validation only
# Notes:
#   - fairchem-core 2.13.0 provides UMA-s-1p1; load via FAIRChemCalculator.
#   - The UMA checkpoint is fetched from huggingface (facebook/UMA),
#     snapshot 38529caa, file uma-s-1p1.pt (MD5 36a2f071350be0ee4c15e7ebdd16dde1).
#     See UMA_Checkpoint_Setup.md for offline-cache instructions.
#   - GPU recommended for UMA panels (c, d, e, S2, S3); ~10 min/run on a
#     16 GB consumer GPU.
#   - SI Fig S4 down-selection script targets Python 3.12 + a separate
#     CALPHAD lookup environment; not packaged here.
