name: ptgainsnzn
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10.19
  - pip=24.2
  - numpy=2.0.2
  - pandas=2.3.3
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - scipy=1.14.1
  - ase=3.22.1
  - pymatgen=2025.10.7
  - scikit-image=0.24.0   # Figure 3 automated atom-column detection
  - pillow=10.4.0        # Figure 3 reconstruction image handling
  - plotly=5.24.1        # Figure 3i1 interactive 3-D HTML
  - pip:
    - fairchem-core==2.13.0
    - chgnet==0.4.0  # for SI Fig 3 three-method consensus (Miedema / UMA / CHGNet)
# Notes:
#   - fairchem-core 2.13.0 provides UMA-s-1p1; load via FAIRChemCalculator.
#   - The UMA checkpoint is fetched from huggingface (facebook/UMA),
#     snapshot 38529caa, file uma-s-1p1.pt (MD5 36a2f071350be0ee4c15e7ebdd16dde1).
#     See UMA_Checkpoint_Setup.md for offline-cache instructions.
#   - GPU recommended for from-scratch UMA energy calculations; the quick demo
#     and bundled CSV post-processing do not require GPU hardware.
#   - The SI liquidus predictor (SI_Figures/SI_Table01_ZnDownSelection/
#     script_SI_LiquidusPredictor.py) is pure numpy/pandas/matplotlib/scipy
#     and runs in this same environment. No CALPHAD package required.
